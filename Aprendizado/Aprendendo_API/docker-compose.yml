services:
  # Serviço de Banco de Dados
  db:
    image: postgres:16-alpine
    container_name: tarefas-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tarefas_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tarefas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Serviço da API (Backend)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tarefas-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/tarefas_db?schema=public"
      BETTER_AUTH_SECRET: "seu_secret_super_seguro"
      BETTER_AUTH_URL: "http://localhost:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Serviço do Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tarefas-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
